name: GPG Key Expiry Alert

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check-gpg-key-expiry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GPG
        run: sudo apt-get update && sudo apt-get install -y gnupg

      - name: Run GPG expiry check
        run: |
          chmod +x scripts/check-gpg-expiry.sh
          ./scripts/check-gpg-expiry.sh

      - name: Send email alert
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: GPG Key Expiry Alert
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: file://expiry-alert.txt
